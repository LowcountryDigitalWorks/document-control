name: Temporary Content Ingestion Finalizer

on:
  push:
    branches:
      - release/content-ingestion-architecture-1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/content-ingestion-architecture-1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and verify candidate
        run: |
          pnpm format
          pnpm format:check
      - name: Remove temporary finalizer and commit exact formatted tree
        run: |
          rm .github/workflows/content-ingestion-format-artifact.yml
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize content ingestion candidate formatting"
          git push origin HEAD:release/content-ingestion-architecture-1
