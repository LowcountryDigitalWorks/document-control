name: Temporary Content Ingestion Format Preview

on:
  push:
    branches:
      - release/content-ingestion-architecture-1

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/content-ingestion-architecture-1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply intended finalization in runner only
        run: python scripts/content-ingestion-release-finalize.py --apply
      - name: Format in runner only
        run: pnpm format
      - name: Show exact formatted diff
        run: git diff --no-ext-diff -- . ':!pnpm-lock.yaml'
