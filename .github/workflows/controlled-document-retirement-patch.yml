name: Controlled Document Retirement Integration

on:
  push:
    branches:
      - feature/controlled-document-retirement

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/controlled-document-retirement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/patch-controlled-document-retirement.py
      - name: Normalize generated type imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/application/authorized-document-workflow-service.ts')
          text = path.read_text()
          text = text.replace(
              '  Approval,\n  DocumentVersion,',
              '  Approval,\n  Document,\n  DocumentVersion,',
              1,
          )
          text = text.replace(
              'Promise<import("../domain/models").Document>',
              'Promise<Document>',
              1,
          )
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write src tests migrations README.md docs
      - run: pnpm check
      - name: Commit validated controlled document retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests migrations README.md docs
          git commit -m "Add controlled document retirement"
          git push origin HEAD:feature/controlled-document-retirement
