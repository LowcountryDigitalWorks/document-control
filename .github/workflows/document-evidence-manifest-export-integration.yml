name: Document Evidence Manifest Export Integration

on:
  push:
    branches:
      - feature/document-evidence-manifest-export
    paths:
      - .github/workflows/document-evidence-manifest-export-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/document-evidence-manifest-export
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply permanent feature patch
        run: python scripts/patch-document-evidence-manifest-export.py
      - name: Format permanent changes
        run: pnpm exec prettier --write src tests README.md docs
      - name: Validate repository
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate document evidence browser flow
        run: pnpm exec playwright test tests/e2e/document-detail.spec.ts
      - name: Commit permanent feature
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add README.md docs/HANDOFF.md docs/STATUS.md src/index.ts src/application/document-evidence-export.ts src/ui/render-document-detail.ts tests/e2e/document-detail.spec.ts tests/unit/document-evidence-export.test.ts
          git diff --cached --check
          git commit -m "Add versioned document evidence manifest export"
          git push origin HEAD:feature/document-evidence-manifest-export
