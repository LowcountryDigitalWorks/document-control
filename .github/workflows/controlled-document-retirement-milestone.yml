name: Controlled Document Retirement Milestone

on:
  push:
    branches:
      - feature/controlled-document-retirement

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/controlled-document-retirement
          fetch-depth: 0
      - name: Record PR 33 milestone
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/STATUS.md')
          text = path.read_text()
          old = "  provider-neutral custom workspace roles PR #29, provider-neutral tenant member lifecycle PR #30,\n  terminal custom role retirement PR #31, and workflow authoring improvements PR #32.\n"
          new = "  provider-neutral custom workspace roles PR #29, provider-neutral tenant member lifecycle PR #30,\n  terminal custom role retirement PR #31, workflow authoring improvements PR #32, and controlled\n  document retirement PR #33.\n"
          if old not in text:
              raise SystemExit('STATUS milestone marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit milestone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md
          git diff --cached --check
          git commit -m "Record controlled document retirement milestone"
          git push origin HEAD:feature/controlled-document-retirement
