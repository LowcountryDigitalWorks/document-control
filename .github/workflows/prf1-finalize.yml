name: PRF1 Finalize

on:
  push:
    branches: [release/production-readiness-foundation-1]

permissions:
  contents: write

concurrency:
  group: prf1-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve status and handoff history while adding the current production-readiness boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          status = Path("docs/STATUS.md")
          status_text = status.read_text()
          status_marker = "### Production Readiness Foundation I — Threat Model & Architecture Boundaries"
          if status_marker not in status_text:
              status_text += """

          ### Production Readiness Foundation I — Threat Model & Architecture Boundaries

          - Production-readiness work now pivots from synthetic feature breadth to the security and architecture boundaries required before real authentication, tenant provisioning, arbitrary content ingestion, or controlled staging.
          - `docs/THREAT_MODEL.md` records protected assets, actors, trust boundaries, existing mitigations, planned mitigations, residual decisions, and release gates. It is an engineering threat model, not a compliance certification or determination.
          - ADR `0002-d1-sqlite-initial-production-persistence.md` records D1/SQLite as the accepted initial production metadata/state-store architecture. Domain/business invariants remain provider-independent, while current application persistence is materially SQL/SQLite coupled through raw `DatabaseProvider` operations.
          - `src/index.ts` is now only the Worker composition entrypoint. Hono application assembly, dependency wiring, synthetic-session/form helpers, and bounded route groups live under `src/http/`; route modules consume injected application dependencies rather than instantiating D1/R2 adapters.
          - Architecture regression coverage protects the composition/domain/provider boundaries, while browser regression coverage verifies the global CSP/security-header baseline across system, guided-workflow, and workspace routes.
          - Route decomposition has zero intended product behavior change. Existing tenant/workspace authorization, synthetic session isolation, same-origin protections, exact-version/hash evidence, template provenance, workflow immutability, append-only audit behavior, and no-upload boundary remain unchanged.
          - Production authentication/session management, tenant provisioning, customer uploads, malware scanning/quarantine, production D1/R2/Worker resources, retention/legal hold, complete backup/restore, customer data, PHI, PostgreSQL, analytics/tracking, and paid services remain unimplemented.
          - Recommended sequencing is Foundation I -> Operations & Supply-Chain Foundation -> Production Identity & Tenant Boundary -> Content Ingestion Architecture -> explicitly approved controlled staging vertical slice -> later retention/backup/customer-readiness gates. Those labels are sequencing guidance, not automatic authorization.
          - This release introduces no new dependency or recurring service cost.
          """
              status.write_text(status_text)

          handoff = Path("docs/HANDOFF.md")
          handoff_text = handoff.read_text()
          handoff_marker = "## Production Readiness Foundation I boundary"
          if handoff_marker not in handoff_text:
              handoff_text += """

          ## Production Readiness Foundation I boundary

          The repository has entered a production-readiness phase. Do not resume adding unrelated synthetic feature breadth merely because the synthetic application can support it.

          - D1/SQLite is the accepted initial production metadata/state-store architecture. Domain/business rules remain provider-independent, but the current application persistence implementation is materially SQL/SQLite coupled because `DatabaseProvider` exposes raw SQL. A different provider is not a drop-in PostgreSQL capability. See ADR 0002.
          - `src/index.ts` should remain the minimal Worker composition entrypoint. HTTP application assembly and bounded route groups live under `src/http/`; route modules must receive application dependencies rather than instantiate D1/R2 infrastructure directly.
          - `docs/THREAT_MODEL.md` is the authoritative production-readiness threat baseline. Keep current mitigations distinct from planned controls and never convert a planned mitigation into a capability claim before implementation and validation.
          - The intended sequence is Production Readiness Foundation I; Operations & Supply-Chain Foundation; Production Identity & Tenant Boundary; Content Ingestion Architecture; an explicitly approved controlled staging vertical slice; then later retention, backup/recovery, and customer-readiness gates. A sequence label does not authorize its implementation.
          - Production authentication/SSO/session management, production tenant provisioning, arbitrary customer uploads, malware scanning/quarantine, production Cloudflare resources, retention/legal hold, complete backup/restore, customer data, PHI, PostgreSQL, and paid runtime services remain outside the current repository capability and authorization boundary.
          - Continue to preserve existing tenant isolation, membership/role/permission authorization, exact-version/hash approval evidence, immutable template/workflow history, append-only audit evidence, same-origin synthetic mutation controls, and synthetic-session isolation while production boundaries are introduced incrementally.
          """
              handoff.write_text(handoff_text)
          PY
      - name: Format changed release files
        run: >-
          pnpm exec prettier --write
          src/http
          tests/unit/http-architecture.test.ts
          tests/e2e/security-headers.spec.ts
          README.md
          SECURITY.md
          docs/ARCHITECTURE.md
          docs/THREAT_MODEL.md
          docs/IDENTITY_AUTHORIZATION_BOUNDARY.md
          docs/adr/0002-d1-sqlite-initial-production-persistence.md
          docs/STATUS.md
          docs/HANDOFF.md
      - run: pnpm check
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level=high
      - name: Commit validated finalization and remove temporary helper
        run: |
          rm .github/workflows/prf1-finalize.yml
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize production readiness foundation"
          git push origin HEAD:release/production-readiness-foundation-1
