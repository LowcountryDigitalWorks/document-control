name: Identity Boundary Reconciliation

on:
  push:
    branches: [release/production-identity-tenant-boundary-1]

permissions:
  contents: read

concurrency:
  group: identity-boundary-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch required durable identity documentation in runner only
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          def insert_before(path: str, marker: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text()
              if marker not in text:
                  raise SystemExit(f"{path}: marker not found: {marker}")
              p.write_text(text.replace(marker, addition.rstrip() + "\n\n" + marker, 1))

          def append_section(path: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text().rstrip()
              if addition.strip().splitlines()[0] in text:
                  raise SystemExit(f"{path}: section already present")
              p.write_text(text + "\n\n" + addition.strip() + "\n")

          replace_once(
              "docs/ARCHITECTURE.md",
              "Production authentication/SSO/session management is not implemented by this release.\nSee `docs/IDENTITY_AUTHORIZATION_BOUNDARY.md`.",
              "Provider-neutral authenticated-principal, identity-mapping, session, and tenant-context contracts now exist, but no live identity provider, production session store, or authenticated production route is connected. See `docs/IDENTITY_AUTHORIZATION_BOUNDARY.md`.",
          )
          insert_before(
              "docs/ARCHITECTURE.md",
              "## Controlled templates",
              """## Production authentication and tenant-context boundary

Production Identity & Tenant Boundary I inserts an explicit authentication boundary ahead of tenant-scoped application authorization without changing the authorization model:

```text
validated provider assertion (future provider adapter)
  -> AuthenticatedPrincipal (provider + exact issuer + immutable external subject)
  -> IdentityMappingService
  -> application-owned identity_subject
  -> opaque authenticated session
  -> HTTP authentication middleware
  -> server-validated tenant/workspace context
  -> existing authorized application service
  -> active membership + live role binding + permission + resource scope
```

`AuthenticatedPrincipal` deliberately carries no provider access token, refresh token, ID token, password, MFA secret, or browser authority. Email and display name are optional bounded presentation/provisioning metadata only. Provider identity maps through the existing unique `(provider, provider_subject)` schema key. For external authentication, `provider_subject` is a canonical JSON tuple of exact issuer plus immutable external subject; provider remains a separate column. Unknown mappings fail closed.

`SessionService` owns provider-neutral session lifetime, lookup, expiry, revocation, and rotation semantics through injectable ports. Session identifiers are 256-bit opaque random values from `CryptoSessionIdGenerator`; browser delivery contains only that opaque reference. The only implementation of a session store added by this release is `src/local-auth/in-memory-session-store.ts`, which is explicitly a deterministic local/test adapter and is not wired into the Worker application.

`DatabaseTenantContextResolver` requires an active application membership and verifies workspace ownership inside the selected tenant. Tenant/workspace values supplied by a browser remain selectors, never authority. Permission decisions remain in `DatabaseAuthorizationPolicy` and authorized application facades, so every protected operation re-reads current membership/role state. A session therefore cannot preserve access after suspension or role removal.

`src/http/authentication.ts` provides bounded middleware for future protected routes. It resolves only the opaque session reference and places only normalized `subjectId`, authentication time, session creation time, and expiry into request context. Missing, expired, or revoked sessions receive the same bounded `401 Authentication required.` response. The middleware is intentionally **not registered in `src/http/app.ts` yet** because a production identity provider and production session store are absent.

The existing `/demo` application remains structurally separate. Its `ldw_guided_demo_session` cookie continues to derive synthetic demo state under `/demo`; it is not accepted as a production-authenticated session and no `src/local-auth` adapter is imported by normal HTTP composition.
""",
          )

          replace_once(
              "docs/IDENTITY_AUTHORIZATION_BOUNDARY.md",
              "This document does not select or configure a production identity provider, create an Entra\napplication registration, connect Active Directory, enable SSO, implement SCIM/group sync, or add\nproduction credentials. Production login sessions and production tenant provisioning are also not\nimplemented. Those remain future deployment decisions with separate security, rollback, ownership,\nand validation review.",
              "This document does not select or configure a production identity provider, create an Entra\napplication registration, connect Active Directory, enable SSO, implement SCIM/group sync, or add\nproduction credentials. Production Identity & Tenant Boundary I now provides provider-neutral\nauthenticated-principal, identity-mapping, session, tenant-context, and HTTP authentication contracts\nplus deterministic local/test adapters. No live provider, production session store, authenticated\nproduction route, or production tenant-provisioning flow is implemented. Those remain future\ndeployment decisions with separate security, rollback, ownership, and validation review.",
          )
          append_section(
              "docs/IDENTITY_AUTHORIZATION_BOUNDARY.md",
              """## Production Identity & Tenant Boundary I — implemented contracts

### Authenticated principal

A successfully validated provider adapter must emit `AuthenticatedPrincipal` containing only the minimum provider-neutral identity facts needed by the application boundary: provider family, exact issuer, immutable external subject, and authenticated-at timestamp. Optional email and display name are bounded presentation/provisioning metadata; changing either one cannot change the mapping key or application authority.

Raw access tokens, refresh tokens, ID tokens, passwords, MFA material, private keys, client secrets, unrestricted claim payloads, and browser cookies are not part of the principal, identity-subject record, session audit event, or application authorization request.

### Immutable provider mapping

External provider identity maps to `identity_subjects` using:

`provider + canonical JSON([exact issuer, immutable external subject])`

The provider remains the existing `identity_subjects.provider` value and the canonical issuer/subject tuple is stored in the existing `provider_subject` column for provisioned external identities. This uses the existing unique `(provider, provider_subject)` constraint, so no schema migration is required for this slice.

Issuer and external subject are treated as immutable exact identifiers after bounded trimming/validation. They are not lower-cased or replaced with email/domain/display values. An unknown provider+issuer+subject mapping fails closed. This release does not create a JIT provisioning path; a future approved provisioning flow must create the mapping before access can succeed.

### Session core

`SessionService` is independent of a specific IdP and production session technology. A session records an opaque 64-hex-character/256-bit identifier, internal `subjectId`, authentication timestamp, creation timestamp, and explicit expiry. Server-side store state records revocation. The service enforces bounded lifetime (maximum 24 hours at the contract boundary), expiry, explicit revoke/logout, and rotation that invalidates the old identifier without extending its original expiry.

`CryptoSessionIdGenerator` uses platform cryptographic randomness. `SessionStore` remains an injectable port. `InMemorySessionStore` under `src/local-auth/` is deterministic/local-test infrastructure only; selecting durable production session storage is intentionally deferred.

Session security events are minimized to event type, internal subject ID, and timestamp for established/revoked/rotated decisions. The contract deliberately excludes raw session IDs, cookies, emails, provider claims, and token/credential material. No production audit sink is selected in this release.

### Authenticated tenant context and live authorization

For tenant-scoped routes, the browser may present a tenant/workspace selector, but `DatabaseTenantContextResolver` accepts it only after joining it to the normalized authenticated internal subject and verifying an **active** membership plus workspace ownership inside that tenant. Failure is generic and does not reveal another tenant's existence.

Tenant-context resolution still does not grant a permission. Existing authorized application services and `DatabaseAuthorizationPolicy` remain the authority boundary and re-read active membership plus current role bindings for every protected operation. Suspending membership or removing a role after session issuance therefore removes application access without waiting for the session to expire.

### HTTP delivery, cookies, and CSRF

`src/http/authentication.ts` resolves the opaque session cookie and places only normalized authenticated context into Hono request state. Missing, malformed, expired, or revoked sessions produce the same bounded 401 response; raw provider/session internals are not returned.

The test-delivery cookie is HttpOnly, uses `Secure` on HTTPS, has an explicit bounded `Max-Age`, and is scoped to `/` because no production application route prefix is selected yet. `SameSite=Strict` is the conservative local/test posture. The exact production cookie and redirect policy must be re-reviewed with the actual OIDC/SAML/Entra redirect model before a live adapter is connected.

Existing same-origin mutation enforcement and the global CSP/security headers are unchanged. Future authenticated state-changing routes must preserve same-origin/CSRF protection; an IdP redirect endpoint must not be used as justification to weaken ordinary mutation protection.

### Local/test identity adapter versus synthetic demo

`src/local-auth/deterministic-identity-adapter.ts` represents a provider assertion that has already been validated; it accepts no username/password and performs no real authentication. It exists only to exercise contracts deterministically.

The `/demo` experience remains a separate synthetic product demonstration with its own `ldw_guided_demo_session` namespace, derived synthetic tenant/subjects, and `/demo` cookie path. The production-auth middleware is not wired into `src/http/app.ts`, and the demo cookie cannot satisfy the new authenticated-session parser.

### Still unresolved before live production identity

A later provider-integration release must select and validate the real provider/protocol, assertion signature/issuer/audience/nonce/state checks, application registration ownership, redirect URIs, production session storage, session revocation/cleanup operations, login/logout endpoints, provider/client credentials, MFA/conditional-access expectations, provisioning ownership, optional SCIM/group mapping, disabled-user/deprovisioning behavior, production cookie/CSRF redirect semantics, break-glass administration, and monitoring/audit sink behavior.
""",
          )

          replace_once(
              "docs/THREAT_MODEL.md",
              "The repository remains pre-production. Product-shaped interactive routes are synthetic/test-only.\nProduction authentication, tenant provisioning, customer uploads, malware scanning/quarantine,\nretention/legal hold, complete production backup/recovery, production Cloudflare resources, customer\ndata, and PHI are not implemented or authorized by this baseline.",
              "The repository remains pre-production. Product-shaped interactive routes are synthetic/test-only.\nProduction Identity & Tenant Boundary I adds provider-neutral authentication/session contracts and\ndeterministic local/test adapters, but no live identity provider, production session store, or\nauthenticated production application route is connected. Tenant provisioning, customer uploads,\nmalware scanning/quarantine, retention/legal hold, complete production backup/recovery, production\nCloudflare resources, customer data, and PHI remain unimplemented and unauthorized.",
          )
          replace_once(
              "docs/THREAT_MODEL.md",
              "Future/residual: Production Identity & Tenant Boundary must establish authenticated tenant context,\nconsistent production error mapping, and hostile cross-tenant route tests. Tenant provisioning and\nreal authenticated routing are not implemented.",
              "Current: Production Identity & Tenant Boundary I adds normalized authenticated context plus\n`DatabaseTenantContextResolver`, which requires active membership and verifies workspace ownership\ninside the selected tenant. Browser tenant/workspace IDs are selectors only; generic denial avoids\ncross-tenant enumeration. Unit coverage exercises hostile cross-tenant selectors.\n\nFuture/residual: wire this boundary only after a real provider and production session store are\napproved, then add end-to-end hostile-ID tests against authenticated production-shaped routes. Tenant\nprovisioning and live authenticated routing remain unimplemented.",
          )
          replace_once(
              "docs/THREAT_MODEL.md",
              "Future/residual: production adapters must validate provider assertions and map immutable provider\nsubjects/groups to internal membership/role state with default-deny behavior. JIT/SCIM/group mapping\nand deprovisioning remain undecided.",
              "Current: provider-neutral principal normalization now requires provider + exact issuer + immutable\nexternal subject. `IdentityMappingService` maps only that canonical identity to an application-owned\nsubject and unknown mappings fail closed; email/display metadata cannot grant authority.\n\nFuture/residual: the real provider adapter must still validate signatures, issuer/audience, state/nonce\nand other protocol requirements before emitting `AuthenticatedPrincipal`. JIT/SCIM/group mapping,\nprovider deprovisioning, and group ownership remain undecided.",
          )
          replace_once(
              "docs/THREAT_MODEL.md",
              "Future/residual: production session rotation, lifetime/revocation, authentication binding, CSRF\nstrategy, and IdP redirect behavior must be designed and tested. Synthetic cookies are not production\nsessions.",
              "Current: provider-neutral `SessionService` enforces opaque 256-bit IDs, explicit bounded lifetime,\nexpiry, revocation/logout, and rotation that invalidates the prior ID without extending expiry. HTTP\nmiddleware accepts only the separate authenticated-session cookie and passes normalized internal\ncontext. The existing demo cookie remains synthetic and isolated.\n\nFuture/residual: select a production session store and real IdP binding; validate provider logout and\nserver-side cleanup; finalize cookie/SameSite/CSRF behavior against the actual redirect flow; and test\nsession theft/replay/rotation behavior end to end. Synthetic cookies remain non-production.",
          )
          insert_before(
              "docs/THREAT_MODEL.md",
              "## Security gates before production capabilities",
              """## Production Identity & Tenant Boundary I implemented controls

This release establishes executable provider-neutral identity/session boundaries without connecting a live provider:

- bounded `AuthenticatedPrincipal` with provider, exact issuer, immutable external subject, and authentication timestamp only;
- optional email/display metadata that cannot affect mapping or authorization;
- canonical provider+issuer+subject mapping to an application-owned identity subject, with unknown mappings denied;
- no JIT/email-domain auto-enrollment;
- cryptographically random opaque session identifiers with explicit lifetime, expiry, revoke/logout, and rotation semantics;
- injectable session store with only an isolated local/test in-memory implementation supplied;
- minimized session security-event contract with no token/cookie/claim material;
- authenticated tenant/workspace context that requires current active membership and validates workspace ownership;
- existing authorized application services continue to re-read current role/permission state, so membership suspension or role removal takes effect despite a still-valid session;
- bounded HTTP authentication middleware returning one generic 401 for missing/expired/revoked session state;
- conservative local/test cookie semantics and unchanged same-origin/CSP/security-header protections; and
- mechanical tests proving the synthetic `/demo` session remains isolated and is not wired as production authentication.

Residual production identity work remains substantial: live assertion validation, provider/client registration and credentials, production session storage, redirect/login/logout endpoints, MFA/conditional-access policy, provisioning/SCIM/group mapping, deprovisioning, production cookie/CSRF semantics, break-glass administration, operational monitoring/audit sink, and controlled authenticated staging.
""",
          )
          replace_once(
              "docs/THREAT_MODEL.md",
              "### Production Identity & Tenant Boundary\n\nMust establish production authentication/session semantics, authenticated tenant context,\nprovisioning/IdP normalization, revocation/deprovisioning, production CSRF/session controls, and\nhostile cross-tenant authorization tests before production user access.",
              "### Production Identity & Tenant Boundary I — authentication contracts established\n\nProvider-neutral principal normalization, identity mapping, session lifetime/revocation/rotation,\nauthenticated tenant/workspace context, bounded HTTP middleware, local/test adapters, and hostile\nselector/revocation tests are established. Live provider assertion validation, production session\nstorage, provider provisioning/deprovisioning, final redirect/cookie/CSRF semantics, and authenticated\ncontrolled staging remain future gates before production user access.",
          )

          insert_before(
              "docs/OPERATIONS_RECOVERY.md",
              "## Cost and implementation impact",
              """## Authentication/session operational boundary after Production Identity & Tenant Boundary I

Provider-neutral identity mapping is now application state: external provider identity is represented by the existing `identity_subjects.provider` plus canonical issuer/immutable-subject value in `provider_subject`. Those mappings, memberships, and role bindings are D1 metadata/state and must remain consistent with the existing recovery rules before live identity is enabled.

Authenticated session state is deliberately **not** added to D1 or the portable application export in this release. `SessionStore` is an application port and the only supplied implementation is the isolated in-memory local/test adapter. A future production session-store decision must define availability, expiry cleanup, revocation propagation, operational monitoring, and incident invalidation without turning provider tokens or session secrets into portable business records.

A future production recovery must fail closed for authentication when session-store state is unavailable or cannot be trusted. Recovery must not recreate authenticated sessions from portable exports, audit events, emails, display names, or provider claims. Depending on the eventual store and incident type, forcing re-authentication after recovery may be safer than attempting to restore ephemeral session state; that decision must be made explicitly with the selected provider/session architecture.

Provider/client secrets, signing keys, access/refresh/ID tokens, MFA material, session identifiers/cookies, and recovery credentials remain excluded from repository documentation, portable exports, and ordinary application audit data. Production credential and provider configuration recovery remains a separate protected operations concern.
""",
          )

          replace_once(
              "docs/STATUS.md",
              "- Production authentication/SSO, production session management, or identity-provider integration.",
              "- Live production authentication/SSO or identity-provider integration; production session storage and provider login/logout wiring remain unselected. Provider-neutral authentication/session contracts now exist under Production Identity & Tenant Boundary I.",
          )
          append_section(
              "docs/STATUS.md",
              """### Production Identity & Tenant Boundary I — Authentication Contracts & Session Core

- `AuthenticatedPrincipal` now represents only provider family, exact issuer, immutable external subject, authentication time, and optional bounded presentation metadata. Email/display name cannot determine application authority and raw access/refresh/ID tokens, passwords, MFA material, and credentials are absent from the contract.
- External identity normalization maps `provider + canonical JSON([issuer, subject])` to the existing application-owned `identity_subjects` record. Unknown mappings fail closed; no email-domain auto-enrollment or JIT provisioning is implemented. The existing unique `(provider, provider_subject)` schema is sufficient, so no migration is introduced.
- `SessionService` provides provider-neutral opaque-session lifecycle through injectable ports: 256-bit IDs, bounded lifetime, expiry, explicit revocation/logout, and rotation that invalidates the old ID without extending expiry. `CryptoSessionIdGenerator` uses platform cryptographic randomness.
- `src/local-auth/` contains the only supplied session store and deterministic identity adapter; both are local/test-only and are not wired into normal Worker composition. No fake username/password login is created.
- `DatabaseTenantContextResolver` verifies active membership plus tenant/workspace ownership using the normalized internal subject. Browser tenant/workspace values remain selectors, not authority.
- Existing authorized application facades and `DatabaseAuthorizationPolicy` continue to evaluate live role/permission state on every protected operation. Tests prove a still-valid session loses access after membership suspension or role removal.
- `src/http/authentication.ts` provides bounded future-route middleware that resolves the separate opaque authenticated-session cookie and passes only internal subject/session timestamps. Missing, malformed, expired, and revoked sessions receive a generic 401. The middleware is intentionally not registered in `src/http/app.ts` until a real provider and production session store are approved.
- Local/test cookie delivery is HttpOnly, Secure on HTTPS, explicitly time-bounded, and SameSite=Strict. Production redirect/SameSite/CSRF behavior remains to be reviewed against the actual provider. Existing same-origin mutation enforcement and CSP/security headers are unchanged.
- Session security-event contracts are minimized to established/revoked/rotated + internal subject + timestamp. No production audit sink is selected and no token/cookie/email/claim payload is included.
- The existing `/demo` experience remains structurally separate with its own `ldw_guided_demo_session` namespace and synthetic identities. It is not production authentication and cannot satisfy the new authenticated-session parser.
- Live Entra/OIDC/SAML integration, provider/client credentials, production MFA/conditional-access settings, SCIM/JIT provisioning, production session storage, tenant provisioning, production Cloudflare resources, customer uploads, customer data, PHI, and paid services remain unimplemented. Expected new recurring cost remains `$0`.
""",
          )

          append_section(
              "docs/HANDOFF.md",
              """## Production Identity & Tenant Boundary I — Authentication Contracts & Session Core boundary

- Exact authorized base for this release is `5f68d31b77f0785b27f206760b4a60b59f1f6617`; work belongs on `release/production-identity-tenant-boundary-1` and must return through a draft pull request without specialist merge.
- Preserve the authentication/authorization chain: validated external principal -> application-owned identity subject -> active tenant membership -> applicable internal role binding -> required permission -> tenant/workspace/resource scope. Provider identity never directly grants an application permission.
- `AuthenticatedPrincipal` uses provider family, exact issuer, immutable external subject, authentication time, and optional bounded presentation metadata. Never add provider access/refresh/ID tokens, passwords, MFA material, credentials, unrestricted claim payloads, email-domain authority, or display-name authority to this contract.
- External mapping uses the existing unique `(provider, provider_subject)` schema. For provisioned external identities, `provider_subject` is the canonical JSON tuple `[issuer, immutable subject]`; unknown mappings fail closed. This first slice needs no schema migration and implements no JIT/SCIM/email-domain enrollment.
- `SessionService` owns opaque 256-bit session IDs, bounded lifetime, expiry, revocation/logout, and rotation through injected ports. `CryptoSessionIdGenerator` is provider-neutral; `src/local-auth/in-memory-session-store.ts` and `deterministic-identity-adapter.ts` are local/test-only and must not be imported into production Worker composition.
- `DatabaseTenantContextResolver` establishes server-side tenant/workspace context only for an authenticated internal subject with active membership and a workspace that belongs to the tenant. Browser tenant/workspace identifiers are selectors only and failure is deliberately generic.
- Permission decisions remain in the existing authorized application services and `DatabaseAuthorizationPolicy`; do not move role/permission logic into authentication middleware. This is what makes membership suspension and role removal effective immediately even while the opaque session itself remains valid.
- `src/http/authentication.ts` is a bounded middleware building block, not a live login system. It accepts only the separate `ldw_authenticated_session` opaque cookie, emits one generic authentication failure, and passes normalized internal context. It is intentionally not registered in `src/http/app.ts` until a production provider/session store is separately authorized.
- Keep the `/demo` path isolated. `ldw_guided_demo_session`, synthetic demo identities, `DEMO_MUTATIONS_ENABLED`, and demo same-origin behavior remain synthetic product-demonstration mechanisms rather than production authentication.
- Local/test cookie posture is HttpOnly, Secure on HTTPS, explicit Max-Age, SameSite=Strict, Path=/. Revisit exact cookie path, redirect behavior, SameSite, CSRF, logout, and provider callback semantics with the real OIDC/SAML/Entra adapter; do not weaken ordinary same-origin mutation protection to accommodate callbacks.
- Session security events contain only established/revoked/rotated, internal subject ID, and timestamp. No production sink is selected. Never log raw token, cookie, email claim, MFA material, provider credential, or unrestricted claims.
- Next live-identity work must still select/validate provider protocol and assertion checks, registration/redirect ownership, production session storage, provider logout/revocation, MFA/conditional access, provisioning/SCIM/group mapping and deprovisioning, break-glass administration, operational monitoring/audit sink, and authenticated controlled staging.
- Customer uploads, malware scanning/quarantine, production Cloudflare resources, production tenant provisioning, retention/legal hold, customer data, PHI, PostgreSQL, analytics/tracking, and paid services remain outside this boundary. Expected new recurring cost remains `$0`.
""",
          )
