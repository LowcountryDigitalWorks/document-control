name: Identity Boundary Finalizer

on:
  push:
    branches: [release/production-identity-tenant-boundary-1]

permissions:
  contents: write

concurrency:
  group: identity-boundary-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/identity-boundary-reconcile.py
      - run: pnpm format
      - run: pnpm check
      - name: Commit permanent candidate and remove temporary finalizer
        run: |
          git rm .github/workflows/identity-boundary-reconcile.yml scripts/identity-boundary-reconcile.py
          git add src tests docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize production identity and tenant boundary I"
          git push origin HEAD:release/production-identity-tenant-boundary-1
