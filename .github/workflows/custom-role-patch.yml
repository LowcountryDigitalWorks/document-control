name: Custom Role Patch

on:
  push:
    branches:
      - feature/custom-workspace-roles

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/custom-workspace-roles
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/patch-custom-role-routes.py
      - run: pnpm exec prettier --write src tests docs/IDENTITY_AUTHORIZATION_BOUNDARY.md
      - run: pnpm check
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs/IDENTITY_AUTHORIZATION_BOUNDARY.md
          git commit -m "Implement provider-neutral custom workspace roles"
          git push origin HEAD:feature/custom-workspace-roles
