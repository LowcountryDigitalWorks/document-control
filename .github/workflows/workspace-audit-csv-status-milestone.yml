name: Workspace Audit CSV Status Milestone

on:
  push:
    branches:
      - feature/workspace-audit-csv-export
    paths:
      - .github/workflows/workspace-audit-csv-status-milestone.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workspace-audit-csv-export
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record PR 35 milestone
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/STATUS.md")
          text = path.read_text()
          old = "  document retirement PR #33, and linear template revision authoring PR #34."
          new = "  document retirement PR #33, linear template revision authoring PR #34, and bounded workspace audit CSV export PR #35."
          if text.count(old) != 1:
              raise SystemExit("Expected STATUS milestone marker not found exactly once")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write docs/STATUS.md
      - run: pnpm format:check
      - name: Commit milestone
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add docs/STATUS.md
          git diff --cached --check
          git commit -m "Record workspace audit CSV release milestone"
          git push origin HEAD:feature/workspace-audit-csv-export
