name: PR27 Demo Seed Maintenance v2

on:
  push:
    branches: [feature/workflow-retirement-deprecation]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-retirement-deprecation
          fetch-depth: 0
      - name: Preserve administrator workflow selection during reseed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/demo/workflow-demo.ts")
          text = path.read_text()
          marker = "    statement(\n      `INSERT OR IGNORE INTO workspace_workflow_assignments"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("workspace workflow assignment seed start missing")
          end_marker = "    ),\n  ]);"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("workspace workflow assignment seed end missing")
          end += len("    ),\n")
          replacement = '''    statement(
              `INSERT OR IGNORE INTO workspace_workflow_assignments
                 (tenant_id, workspace_id, workflow_definition_id,
                  workflow_definition_version, is_default,
                  created_by_subject_id, created_at, updated_by_subject_id, updated_at)
               SELECT ?, ?, ?, 1, 1, ?, ?, ?, ?
               WHERE NOT EXISTS (
                 SELECT 1
                 FROM workspace_workflow_assignments
                 WHERE tenant_id = ? AND workspace_id = ?
               )`,
              [
                demo.tenantId,
                demo.workspaceId,
                demo.workflowDefinitionId,
                demo.authorSubjectId,
                seedTimestamp,
                demo.authorSubjectId,
                seedTimestamp,
                demo.tenantId,
                demo.workspaceId,
              ],
            ),
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/demo/workflow-demo.ts
          git commit -m "Preserve workspace workflow selection during demo reseed"
          git push origin HEAD:feature/workflow-retirement-deprecation
