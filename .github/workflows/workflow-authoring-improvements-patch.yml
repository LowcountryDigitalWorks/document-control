name: Workflow Authoring Improvements Integration

on:
  push:
    branches:
      - feature/workflow-authoring-improvements

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-authoring-improvements
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/patch-workflow-authoring-improvements.py
      - run: pnpm exec prettier --write src tests README.md docs
      - run: pnpm check
      - name: Commit validated workflow authoring integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests README.md docs
          git commit -m "Add workflow authoring improvements"
          git push origin HEAD:feature/workflow-authoring-improvements
