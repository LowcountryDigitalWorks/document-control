name: Template Evidence Detail Integration

on:
  push:
    branches:
      - feature/template-evidence-detail
    paths:
      - .github/workflows/template-evidence-detail-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/template-evidence-detail
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded release patch
        run: python .github/scripts/apply-template-evidence-detail.py
      - name: Format permanent release files
        run: >-
          pnpm exec prettier --write
          README.md docs/HANDOFF.md docs/STATUS.md
          src/index.ts src/ui/render-workspace-app.ts
          src/application/template-detail-read-service.ts
          src/application/authorized-template-detail-read-service.ts
          src/ui/render-template-detail.ts
          tests/unit/template-detail-read-service.test.ts
          tests/unit/authorized-template-detail-read-service.test.ts
          tests/e2e/template-detail.spec.ts
      - name: Validate repository
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate template evidence browser flows
        run: >-
          pnpm exec playwright test
          tests/e2e/template-detail.spec.ts
          tests/e2e/workspace-app.spec.ts
          tests/e2e/template-lifecycle-admin.spec.ts
      - name: Commit permanent release changes
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add README.md docs/HANDOFF.md docs/STATUS.md \
            src/index.ts src/ui/render-workspace-app.ts \
            src/application/template-detail-read-service.ts \
            src/application/authorized-template-detail-read-service.ts \
            src/ui/render-template-detail.ts \
            tests/unit/template-detail-read-service.test.ts \
            tests/unit/authorized-template-detail-read-service.test.ts \
            tests/e2e/template-detail.spec.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent release changes to commit."
          else
            git commit -m "Add controlled template evidence detail"
            git push origin HEAD:feature/template-evidence-detail
          fi
