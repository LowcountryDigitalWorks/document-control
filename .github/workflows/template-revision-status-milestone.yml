name: Template Revision Status Milestone

on:
  push:
    branches:
      - feature/template-revision-authoring

permissions:
  contents: write

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/template-revision-authoring
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record PR 34 milestone
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/STATUS.md')
          text = path.read_text()
          old = "  terminal custom role retirement PR #31, workflow authoring improvements PR #32, and controlled\n  document retirement PR #33.\n"
          new = "  terminal custom role retirement PR #31, workflow authoring improvements PR #32, controlled\n  document retirement PR #33, and linear template revision authoring PR #34.\n"
          if old not in text:
              raise SystemExit('STATUS milestone marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write docs/STATUS.md
      - run: pnpm format:check
      - name: Commit milestone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md
          git commit -m "Record template revision release milestone"
          git push origin HEAD:feature/template-revision-authoring
