name: Format E2E Migration Loader

on:
  push:
    branches:
      - feature/controlled-document-retirement

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/controlled-document-retirement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/e2e-d1.ts
      - run: pnpm check
      - name: Commit validated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/e2e-d1.ts
          git commit -m "Format E2E migration loader"
          git push origin HEAD:feature/controlled-document-retirement
