name: PRF2 Format Report

on:
  push:
    branches: [release/production-readiness-foundation-2]

permissions:
  contents: read

concurrency:
  group: prf2-format-report
  cancel-in-progress: true

jobs:
  format-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture unformatted Foundation II files
        run: |
          mkdir -p prf2-original/docs prf2-original/tests/unit
          cp docs/OPERATIONS_RECOVERY.md prf2-original/docs/
          cp docs/THREAT_MODEL.md prf2-original/docs/
          cp tests/unit/github-actions-security.test.ts prf2-original/tests/unit/
          cp tests/unit/migration-upgrade-path.test.ts prf2-original/tests/unit/
          cp tests/unit/recovery-drill.test.ts prf2-original/tests/unit/
      - name: Format Foundation II files in the runner only
        run: >-
          pnpm exec prettier --write
          docs/OPERATIONS_RECOVERY.md
          docs/THREAT_MODEL.md
          tests/unit/github-actions-security.test.ts
          tests/unit/migration-upgrade-path.test.ts
          tests/unit/recovery-drill.test.ts
      - name: Capture formatted Foundation II files
        run: |
          mkdir -p prf2-formatted/docs prf2-formatted/tests/unit
          cp docs/OPERATIONS_RECOVERY.md prf2-formatted/docs/
          cp docs/THREAT_MODEL.md prf2-formatted/docs/
          cp tests/unit/github-actions-security.test.ts prf2-formatted/tests/unit/
          cp tests/unit/migration-upgrade-path.test.ts prf2-formatted/tests/unit/
          cp tests/unit/recovery-drill.test.ts prf2-formatted/tests/unit/
      - name: Upload formatting reconciliation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prf2-format-reconciliation
          path: |
            prf2-original
            prf2-formatted
          if-no-files-found: error
          retention-days: 1
