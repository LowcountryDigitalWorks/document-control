name: Document Version Change Summary Integration

on:
  push:
    branches:
      - feature/immutable-version-change-summary
    paths:
      - .github/workflows/document-version-change-summary-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/immutable-version-change-summary
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile named-interface patch helper
        run: python scripts/fix-document-version-change-summary-patch.py
      - name: Apply permanent feature patch
        run: python scripts/patch-document-version-change-summary.py
      - name: Format permanent changes
        run: pnpm exec prettier --write src tests README.md docs migrations
      - name: Validate repository
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate focused document evidence flows
        run: pnpm exec playwright test tests/e2e/document-detail.spec.ts tests/e2e/backup-portability.spec.ts tests/e2e/guided-demo.spec.ts
      - name: Commit permanent feature
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add README.md docs/HANDOFF.md docs/STATUS.md docs/contracts/export-v1.md migrations/0011_document_version_change_summary.sql src tests
          git reset scripts/patch-document-version-change-summary.py scripts/fix-document-version-change-summary-patch.py
          git diff --cached --check
          git commit -m "Add immutable document version change summaries"
          git push origin HEAD:feature/immutable-version-change-summary
