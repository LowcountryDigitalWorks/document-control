name: PR27 Portability Maintenance

on:
  push:
    branches: [feature/workflow-retirement-deprecation]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-retirement-deprecation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate lifecycle portability and status
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"marker missing in {path_name}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "src/application/export.ts",
              'export interface WorkspaceWorkflowAssignmentExport {\n',
              'export interface WorkflowDefinitionLifecycleExport {\n  tenantId: string;\n  workflowDefinitionId: string;\n  workflowDefinitionVersion: number;\n  lifecycleState: "active" | "deprecated" | "retired";\n  changedBySubjectId?: string;\n  changedAt: string;\n}\n\nexport interface WorkspaceWorkflowAssignmentExport {\n',
          )
          replace_once(
              "src/application/export.ts",
              '  workflowDefinitions: WorkflowDefinition[];\n  workspaceWorkflowAssignments?: WorkspaceWorkflowAssignmentExport[];\n',
              '  workflowDefinitions: WorkflowDefinition[];\n  workflowDefinitionLifecycles?: WorkflowDefinitionLifecycleExport[];\n  workspaceWorkflowAssignments?: WorkspaceWorkflowAssignmentExport[];\n',
          )
          replace_once(
              "src/application/export.ts",
              '  for (const field of arrayFields) {\n    requireArray(root[field], field);\n  }\n\n  const data = candidate as unknown as PortableExportV1;\n',
              '  for (const field of arrayFields) {\n    requireArray(root[field], field);\n  }\n  if (root.workflowDefinitionLifecycles !== undefined) {\n    requireArray(root.workflowDefinitionLifecycles, "workflowDefinitionLifecycles");\n  }\n  if (root.workspaceWorkflowAssignments !== undefined) {\n    requireArray(root.workspaceWorkflowAssignments, "workspaceWorkflowAssignments");\n  }\n\n  const data = candidate as unknown as PortableExportV1;\n',
          )
          lifecycle_validation = '''  const workflowLifecycleByKey = new Map<
            string,
            WorkflowDefinitionLifecycleExport
          >();
          if (data.workflowDefinitionLifecycles !== undefined) {
            for (const lifecycle of data.workflowDefinitionLifecycles) {
              assertTenant(
                lifecycle.tenantId,
                tenantId,
                `workflow lifecycle ${lifecycle.workflowDefinitionId}`,
              );
              const key = `${lifecycle.workflowDefinitionId}:${lifecycle.workflowDefinitionVersion}`;
              if (!workflowDefinitions.has(key)) {
                throw new Error(
                  `Workflow lifecycle ${key} references a missing workflow definition version.`,
                );
              }
              if (workflowLifecycleByKey.has(key)) {
                throw new Error(`Workflow lifecycle contains duplicate version ${key}.`);
              }
              if (!["active", "deprecated", "retired"].includes(lifecycle.lifecycleState)) {
                throw new Error(`Workflow lifecycle ${key} has an invalid state.`);
              }
              requireString(lifecycle.changedAt, `workflow lifecycle ${key} changedAt`);
              if (lifecycle.changedBySubjectId !== undefined) {
                assertReferenced(subjects, lifecycle.changedBySubjectId, "workflow lifecycle actor");
              }
              workflowLifecycleByKey.set(key, lifecycle);
            }
            if (workflowLifecycleByKey.size !== workflowDefinitions.size) {
              throw new Error(
                "Workflow lifecycle export must contain exactly one record per workflow definition version.",
              );
            }
          }

          '''
          replace_once(
              "src/application/export.ts",
              '  for (const assignment of data.workspaceWorkflowAssignments ?? []) {\n',
              lifecycle_validation + '  for (const assignment of data.workspaceWorkflowAssignments ?? []) {\n',
          )
          replace_once(
              "src/application/export.ts",
              '    if (\n      !workflowDefinitions.has(\n        `${assignment.workflowDefinitionId}:${assignment.workflowDefinitionVersion}`,\n      )\n    ) {\n      throw new Error(\n        `Workspace workflow assignment ${assignment.workspaceId} references a missing workflow definition version.`,\n      );\n    }\n',
              '    const assignmentWorkflowKey = `${assignment.workflowDefinitionId}:${assignment.workflowDefinitionVersion}`;\n    if (!workflowDefinitions.has(assignmentWorkflowKey)) {\n      throw new Error(\n        `Workspace workflow assignment ${assignment.workspaceId} references a missing workflow definition version.`,\n      );\n    }\n    if (\n      workflowLifecycleByKey.get(assignmentWorkflowKey)?.lifecycleState ===\n      "retired"\n    ) {\n      throw new Error(\n        `Workspace workflow assignment ${assignment.workspaceId} references a retired workflow version.`,\n      );\n    }\n',
          )

          replace_once(
              "src/application/portable-export-read-service.ts",
              '  type PortableExportV1,\n  type WorkspaceWorkflowAssignmentExport,\n',
              '  type PortableExportV1,\n  type WorkflowDefinitionLifecycleExport,\n  type WorkspaceWorkflowAssignmentExport,\n',
          )
          replace_once(
              "src/application/portable-export-read-service.ts",
              'interface WorkspaceWorkflowAssignmentRow {\n',
              'interface WorkflowDefinitionLifecycleRow {\n  tenantId: string;\n  workflowDefinitionId: string;\n  workflowDefinitionVersion: number;\n  lifecycleState: "active" | "deprecated" | "retired";\n  changedBySubjectId: string | null;\n  changedAt: string;\n}\ninterface WorkspaceWorkflowAssignmentRow {\n',
          )
          replace_once(
              "src/application/portable-export-read-service.ts",
              '      templateVersions,\n      workflowDefinitions,\n      workspaceWorkflowAssignments,\n      workflowInstances,\n',
              '      templateVersions,\n      workflowDefinitions,\n      workflowDefinitionLifecycles,\n      workspaceWorkflowAssignments,\n      workflowInstances,\n',
          )
          replace_once(
              "src/application/portable-export-read-service.ts",
              '      this.readTemplateVersions(tenantId),\n      this.readWorkflowDefinitions(tenantId),\n      this.readWorkspaceWorkflowAssignments(tenantId),\n      this.readWorkflowInstances(tenantId),\n',
              '      this.readTemplateVersions(tenantId),\n      this.readWorkflowDefinitions(tenantId),\n      this.readWorkflowDefinitionLifecycles(tenantId),\n      this.readWorkspaceWorkflowAssignments(tenantId),\n      this.readWorkflowInstances(tenantId),\n',
          )
          replace_once(
              "src/application/portable-export-read-service.ts",
              '    const exported: PortableExportV1 = {\n      format: exportFormat,\n      version: exportVersion,\n      exportedAt,\n      tenant,\n      tenantConfiguration,\n      identitySubjects,\n      tenantMemberships,\n      workspaces,\n      roleDefinitions,\n      roleBindings,\n      documents,\n      documentVersions,\n      templates,\n      templateVersions,\n      workflowDefinitions,\n      workspaceWorkflowAssignments,\n      workflowInstances,\n',
              '    const exported: PortableExportV1 = {\n      format: exportFormat,\n      version: exportVersion,\n      exportedAt,\n      tenant,\n      tenantConfiguration,\n      identitySubjects,\n      tenantMemberships,\n      workspaces,\n      roleDefinitions,\n      roleBindings,\n      documents,\n      documentVersions,\n      templates,\n      templateVersions,\n      workflowDefinitions,\n      workflowDefinitionLifecycles,\n      workspaceWorkflowAssignments,\n      workflowInstances,\n',
          )
          replace_once(
              "src/application/portable-export-read-service.ts",
              '         UNION SELECT actor_subject_id FROM audit_events WHERE tenant_id = ?\n       )\n       ORDER BY subject.id`,\n      [tenantId, tenantId, tenantId, tenantId, tenantId, tenantId],\n',
              '         UNION SELECT actor_subject_id FROM audit_events WHERE tenant_id = ?\n         UNION SELECT changed_by_subject_id FROM workflow_definition_lifecycle\n           WHERE tenant_id = ? AND changed_by_subject_id IS NOT NULL\n       )\n       ORDER BY subject.id`,\n      [tenantId, tenantId, tenantId, tenantId, tenantId, tenantId, tenantId],\n',
          )
          reader = '''  private async readWorkflowDefinitionLifecycles(
            tenantId: string,
          ): Promise<WorkflowDefinitionLifecycleExport[]> {
            const rows = await this.database.query<WorkflowDefinitionLifecycleRow>(
              `SELECT tenant_id AS tenantId,
                      workflow_definition_id AS workflowDefinitionId,
                      workflow_definition_version AS workflowDefinitionVersion,
                      lifecycle_state AS lifecycleState,
                      changed_by_subject_id AS changedBySubjectId,
                      changed_at AS changedAt
               FROM workflow_definition_lifecycle
               WHERE tenant_id = ?
               ORDER BY workflow_definition_id, workflow_definition_version`,
              [tenantId],
            );
            return rows.map((row) => ({
              tenantId: row.tenantId,
              workflowDefinitionId: row.workflowDefinitionId,
              workflowDefinitionVersion: Number(row.workflowDefinitionVersion),
              lifecycleState: row.lifecycleState,
              changedBySubjectId: row.changedBySubjectId ?? undefined,
              changedAt: row.changedAt,
            }));
          }

          '''
          replace_once(
              "src/application/portable-export-read-service.ts",
              '  private async readWorkspaceWorkflowAssignments(\n',
              reader + '  private async readWorkspaceWorkflowAssignments(\n',
          )

          replace_once(
              "tests/unit/workflow-definition-admin-service.test.ts",
              '  const migrationFiles = [\n    "0001_initial.sql",\n    "0002_system_role_permissions.sql",\n    "0003_workflow_definition_immutability.sql",\n  ];\n',
              '  const migrationFiles = [\n    "0001_initial.sql",\n    "0002_system_role_permissions.sql",\n    "0003_workflow_definition_immutability.sql",\n    "0004_template_version_lifecycle_integrity.sql",\n    "0005_workspace_workflow_selection.sql",\n    "0006_workflow_definition_lifecycle.sql",\n  ];\n',
          )
          replace_once(
              "tests/unit/workspace-workflow-selection-service.test.ts",
              '    "0005_workspace_workflow_selection.sql",\n  ]) {\n',
              '    "0005_workspace_workflow_selection.sql",\n    "0006_workflow_definition_lifecycle.sql",\n  ]) {\n',
          )

          replace_once(
              "docs/STATUS.md",
              '- Workflow retirement/deprecation semantics or richer workflow authoring.\n',
              '- Richer workflow authoring beyond immutable versions, workspace selection, and controlled lifecycle.\n',
          )
          section = '''### Controlled Workflow Definition lifecycle administration (synthetic/test only)

          - Exact immutable workflow-definition versions now have separate lifecycle state: `active`,
            `deprecated`, or `retired`; lifecycle changes never rewrite definition content.
          - New versions begin Active. Active versions may be newly assigned to a workspace and selected as a
            new workspace default.
          - Deprecated versions may remain where already configured, including as an existing default so
            administrators can migrate deliberately, but cannot be newly assigned or newly selected as a
            default. Deprecated versions can be reactivated.
          - Retirement is terminal and requires the exact version to be removed from every workspace first.
            Running workflow instances, reviews, approvals, and audit history remain pinned to their original
            exact definition version after retirement.
          - Migration `0006_workflow_definition_lifecycle.sql` enforces legal transitions, blocks new
            assignment/default promotion for non-Active versions, and prevents retirement while assignments
            remain.
          - Lifecycle administration uses `tenant.manage` plus current-workspace `workflow.manage`; successful
            changes append `workflow.definition.lifecycle_transitioned` to the immutable audit stream.
          - Backup & Portability exports include lifecycle state and transition metadata. Legacy v1 exports
            without the additive lifecycle field remain accepted for compatibility.
          - This slice does not delete workflow history, migrate running instances, rewrite approvals, add
            production authentication, create production Cloudflare resources, accept customer data/uploads,
            or add paid services.

          '''
          replace_once(
              "docs/STATUS.md",
              '### Authorized controlled Template Lifecycle administration (synthetic/test only)\n',
              section + '### Authorized controlled Template Lifecycle administration (synthetic/test only)\n',
          )
          replace_once(
              "src/infrastructure/schema.ts",
              '// `migrations/0001_initial.sql` is the authoritative executable schema for the\n// bootstrap. Keeping the relational constraints, triggers, and indexes in one\n// executable source prevents a second schema declaration from silently drifting\n// away from the database invariants. A typed query layer may be introduced later\n// if it can be generated from, or mechanically verified against, the migration.\n\nexport const authoritativeSchemaMigration =\n  "migrations/0001_initial.sql" as const;\n',
              '// The ordered SQL files under `migrations/` are the authoritative executable D1\n// schema. Keeping relational constraints, triggers, and indexes in executable\n// migrations prevents a second schema declaration from silently drifting away from\n// database invariants. A typed query layer may be introduced later if it can be\n// generated from, or mechanically verified against, the migration sequence.\n\nexport const authoritativeSchemaMigrations = "migrations/*.sql" as const;\n',
          )
          PY
          pnpm exec prettier --write src/application/export.ts src/application/portable-export-read-service.ts src/infrastructure/schema.ts tests/unit/workflow-definition-admin-service.test.ts tests/unit/workspace-workflow-selection-service.test.ts docs/STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "Integrate workflow lifecycle portability"
          git push origin HEAD:feature/workflow-retirement-deprecation
