name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: document-control-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan

  normalize-audit-log:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/audit-log'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize Audit Log source
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/ui/render-audit-log.ts \
            tests/e2e/audit-log.spec.ts \
            tests/unit/audit-log-authorization.test.ts \
            tests/unit/audit-log-filter-input.test.ts
          if ! git diff --quiet -- \
            src/ui/render-audit-log.ts \
            tests/e2e/audit-log.spec.ts \
            tests/unit/audit-log-authorization.test.ts \
            tests/unit/audit-log-filter-input.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/ui/render-audit-log.ts \
              tests/e2e/audit-log.spec.ts \
              tests/unit/audit-log-authorization.test.ts \
              tests/unit/audit-log-filter-input.test.ts
            git commit -m "Normalize Audit Log source"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
