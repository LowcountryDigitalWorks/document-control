name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: document-control-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned Prettier in CI workspace
        run: pnpm format
      - name: Preserve exact formatter output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-formatted-source
          retention-days: 1
          path: |
            scripts/scan-secrets.ts
            src/application/export.ts
            src/demo/fixtures.ts
            src/domain/models.ts
            src/domain/template.ts
            src/domain/workflow.ts
            src/infrastructure/schema.ts
            tests/unit/content-store.test.ts
            tests/unit/migration.test.ts
            wrangler.jsonc
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm secrets:scan
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan
