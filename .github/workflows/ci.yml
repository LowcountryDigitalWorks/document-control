name: Workflow Admin Status Maintenance

on:
  push:
    branches: [agent/workflow-definition-admin]

permissions:
  contents: read

concurrency:
  group: workflow-admin-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-status:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workflow-definition-admin
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update authoritative status
        shell: bash
        run: |
          set -euo pipefail
          python .github/maintenance/update_workflow_admin_status.py
          pnpm exec prettier --write docs/STATUS.md
          if ! git diff --quiet -- docs/STATUS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/STATUS.md
            git commit -m "Document immutable Workflow Definition administration"
            git push origin HEAD:agent/workflow-definition-admin
          fi
