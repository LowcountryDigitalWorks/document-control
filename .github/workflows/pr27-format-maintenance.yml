name: PR27 Formatting Maintenance

on:
  push:
    branches: [feature/workflow-retirement-deprecation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-retirement-deprecation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format lifecycle release files
        run: |
          pnpm exec prettier --write \
            src/application/workflow-definition-admin-service.ts \
            src/application/workflow-lifecycle-input.ts \
            src/application/workspace-workflow-selection-service.ts \
            tests/unit/export-roundtrip.test.ts \
            tests/unit/workflow-definition-lifecycle-service.test.ts \
            tests/e2e/workflow-lifecycle.spec.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/application/workflow-definition-admin-service.ts \
              src/application/workflow-lifecycle-input.ts \
              src/application/workspace-workflow-selection-service.ts \
              tests/unit/export-roundtrip.test.ts \
              tests/unit/workflow-definition-lifecycle-service.test.ts \
              tests/e2e/workflow-lifecycle.spec.ts
            git commit -m "Format workflow lifecycle release files"
            git push origin HEAD:feature/workflow-retirement-deprecation
          fi
