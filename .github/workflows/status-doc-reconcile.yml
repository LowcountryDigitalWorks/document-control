name: Status Documentation Reconcile

on:
  push:
    branches:
      - docs/reconcile-workflow-lifecycle-status

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/reconcile-workflow-lifecycle-status
          fetch-depth: 0
      - name: Reconcile status documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/STATUS.md")
          text = path.read_text()
          old_lifecycle = (
              "- Exact immutable workflow-definition versions now have separate lifecycle state: `active`,\n"
              "  `deprecated`, or `retired`; lifecycle changes never rewrite definition content.\n"
              "- New versions begin Active. Active versions may be newly assigned to a workspace and selected as a\n"
              "  new workspace default.\n"
              "- Deprecated versions may remain where already configured, including as an existing default so\n"
              "  administrators can migrate deliberately, but cannot be newly assigned or newly selected as a\n"
              "  default. Deprecated versions can be reactivated.\n"
          )
          new_lifecycle = (
              "- Exact immutable workflow-definition versions use the user-facing lifecycle labels **Active**,\n"
              "  **Legacy**, and **Retired**; lifecycle changes never rewrite definition content. The canonical\n"
              "  persisted/exported machine value behind **Legacy** remains `deprecated`.\n"
              "- New versions begin Active. Active versions may be newly assigned to a workspace and selected as a\n"
              "  new workspace default.\n"
              "- Legacy versions may remain where already configured, including as an existing default so\n"
              "  administrators can migrate deliberately, but cannot be newly assigned or newly selected as a\n"
              "  default. Legacy versions can be returned to Active.\n"
          )
          old_milestone = (
              "  immutable Workflow Definition administration PR #18, controlled Template Lifecycle administration\n"
              "  PR #19, Template Lifecycle integration reconciliation PR #20, and workspace Workflow Selection\n"
              "  administration PR #21.\n"
          )
          new_milestone = (
              "  immutable Workflow Definition administration PR #18, controlled Template Lifecycle administration\n"
              "  PR #19, Template Lifecycle integration reconciliation PR #20, workspace Workflow Selection\n"
              "  administration PR #21, and controlled Workflow Definition lifecycle administration PR #27.\n"
          )
          if old_lifecycle not in text:
              raise SystemExit("workflow lifecycle status block not found")
          if old_milestone not in text:
              raise SystemExit("milestone status block not found")
          text = text.replace(old_lifecycle, new_lifecycle, 1)
          text = text.replace(old_milestone, new_milestone, 1)
          path.write_text(text)
          PY
      - run: git diff --check
      - name: Commit status reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md
          git commit -m "Reconcile workflow lifecycle status documentation"
          git push origin HEAD:docs/reconcile-workflow-lifecycle-status
