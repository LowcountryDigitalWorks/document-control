name: PR21 Formatting Maintenance

on:
  push:
    branches: [agent/workspace-workflow-selection-v2]

permissions:
  contents: write

concurrency:
  group: pr21-format-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-workflow-selection-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only CI-reported files
        run: |
          pnpm exec prettier --write \
            src/application/workspace-workflow-selection-input.ts \
            src/application/workspace-workflow-selection-service.ts \
            tests/e2e/workspace-workflow-selection.spec.ts \
            tests/unit/workspace-workflow-selection-service.test.ts
          if ! git diff --quiet -- \
            src/application/workspace-workflow-selection-input.ts \
            src/application/workspace-workflow-selection-service.ts \
            tests/e2e/workspace-workflow-selection.spec.ts \
            tests/unit/workspace-workflow-selection-service.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/application/workspace-workflow-selection-input.ts \
              src/application/workspace-workflow-selection-service.ts \
              tests/e2e/workspace-workflow-selection.spec.ts \
              tests/unit/workspace-workflow-selection-service.test.ts
            git commit -m "Format workspace workflow selection files"
            git push origin HEAD:agent/workspace-workflow-selection-v2
          fi
