name: Identity Boundary II Finalizer

on:
  push:
    branches:
      - release/production-identity-tenant-boundary-2
    paths:
      - .github/workflows/identity-boundary-2-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/production-identity-tenant-boundary-2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply durable documentation
        run: python scripts/identity-boundary-2-finalize.py
      - name: Format permanent tree
        run: pnpm format
      - name: Remove temporary finalizer
        run: git rm .github/workflows/identity-boundary-2-finalize.yml scripts/identity-boundary-2-finalize.py
      - name: Validate permanent tree
        id: check
        shell: bash
        run: |
          set +e
          pnpm check
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit permanent candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Production Identity and Tenant Boundary II"
          git push origin HEAD:release/production-identity-tenant-boundary-2
      - name: Preserve validation result
        shell: bash
        run: exit "${{ steps.check.outputs.status }}"
