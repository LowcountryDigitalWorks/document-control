name: Template Hotfix Formatter

on:
  push:
    branches: [hotfix/template-lifecycle-integration]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/template-lifecycle-integration
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format reconciled Template Lifecycle files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/application/template-lifecycle-admin-service.ts \
            src/index.ts \
            tests/e2e/template-lifecycle-admin.spec.ts \
            tests/unit/template-lifecycle-admin-service.test.ts \
            tests/unit/template-lifecycle-authorization.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/application/template-lifecycle-admin-service.ts src/index.ts tests/e2e/template-lifecycle-admin.spec.ts tests/unit/template-lifecycle-admin-service.test.ts tests/unit/template-lifecycle-authorization.test.ts
            git commit -m "Format reconciled template lifecycle integration"
            git push origin HEAD:hotfix/template-lifecycle-integration
          fi
