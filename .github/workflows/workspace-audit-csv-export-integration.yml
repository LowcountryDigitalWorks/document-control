name: Workspace Audit CSV Export Integration

on:
  push:
    branches:
      - feature/workspace-audit-csv-export
    paths:
      - .github/workflows/workspace-audit-csv-export-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workspace-audit-csv-export
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply permanent feature patch
        run: python scripts/patch-workspace-audit-csv-export.py
      - name: Format permanent changes
        run: pnpm exec prettier --write src tests README.md docs
      - name: Validate repository
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate Audit Log browser flow
        run: pnpm exec playwright test tests/e2e/audit-log.spec.ts
      - name: Commit permanent feature
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add README.md docs/HANDOFF.md docs/STATUS.md src/index.ts src/application/audit-log-export.ts src/ui/render-audit-log.ts tests/e2e/audit-log.spec.ts tests/unit/audit-log-export.test.ts
          git diff --cached --check
          git commit -m "Add bounded workspace audit CSV export"
          git push origin HEAD:feature/workspace-audit-csv-export
