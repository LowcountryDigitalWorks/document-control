name: Custom Role Retirement Integration

on:
  push:
    branches:
      - feature/custom-role-retirement

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/custom-role-retirement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/patch-custom-role-retirement.py
      - run: pnpm exec prettier --write src scripts/e2e-d1.ts tests
      - run: pnpm check
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts/e2e-d1.ts
          git commit -m "Integrate custom role retirement lifecycle"
          git push origin HEAD:feature/custom-role-retirement
