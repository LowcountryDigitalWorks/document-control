name: Member Lifecycle Patch

on:
  push:
    branches:
      - feature/provider-neutral-member-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/provider-neutral-member-lifecycle
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/patch-member-lifecycle-routes.py
      - run: pnpm exec prettier --write src tests
      - run: pnpm check
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Implement provider-neutral tenant member lifecycle"
          git push origin HEAD:feature/provider-neutral-member-lifecycle
