name: Template Evidence Status Milestone

on:
  push:
    branches:
      - feature/template-evidence-detail
    paths:
      - .github/workflows/template-evidence-status-milestone.yml

permissions:
  contents: write

jobs:
  milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/template-evidence-detail
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record PR 39 milestone
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/STATUS.md")
          text = path.read_text()
          old = "queue-native review and approval actions PR #37, and immutable document-version change summaries PR #38."
          new = "queue-native review and approval actions PR #37, immutable document-version change summaries PR #38, and controlled template evidence detail PR #39."
          if text.count(old) != 1:
              raise SystemExit(f"expected one milestone anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write docs/STATUS.md
          pnpm exec prettier --check docs/STATUS.md
      - name: Commit status milestone
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add docs/STATUS.md
          git diff --cached --check
          git commit -m "Record controlled template evidence milestone"
          git push origin HEAD:feature/template-evidence-detail
