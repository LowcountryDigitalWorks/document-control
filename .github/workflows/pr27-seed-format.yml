name: PR27 Demo Seed Formatting

on:
  push:
    branches: [feature/workflow-retirement-deprecation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-retirement-deprecation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/demo/workflow-demo.ts
      - run: |
          if ! git diff --quiet -- src/demo/workflow-demo.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/demo/workflow-demo.ts
            git commit -m "Format workflow demo seed change"
            git push origin HEAD:feature/workflow-retirement-deprecation
          fi
