name: PR27 Export Test Formatting

on:
  push:
    branches: [feature/workflow-retirement-deprecation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-retirement-deprecation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/unit/export-roundtrip.test.ts
      - run: |
          if ! git diff --quiet -- tests/unit/export-roundtrip.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/unit/export-roundtrip.test.ts
            git commit -m "Format workflow lifecycle export test"
            git push origin HEAD:feature/workflow-retirement-deprecation
          fi
