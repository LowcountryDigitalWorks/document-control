name: PR27 Test Assertion Maintenance

on:
  push:
    branches: [feature/workflow-retirement-deprecation]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-retirement-deprecation
          fetch-depth: 0
      - name: Make lifecycle error assertion case-insensitive
        run: |
          sed -i 's|/only an active workflow version/u|/only an active workflow version/iu|' tests/unit/workflow-definition-lifecycle-service.test.ts
          git diff --exit-code --quiet && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/workflow-definition-lifecycle-service.test.ts
          git commit -m "Correct workflow lifecycle error assertion"
          git push origin HEAD:feature/workflow-retirement-deprecation
