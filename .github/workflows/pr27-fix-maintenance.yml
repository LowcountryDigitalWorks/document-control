name: PR27 Integration Fix Maintenance

on:
  push:
    branches: [feature/workflow-retirement-deprecation]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-retirement-deprecation
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply targeted lifecycle fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"marker missing in {path_name}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "migrations/0006_workflow_definition_lifecycle.sql",
              """WHEN NOT EXISTS (
  SELECT 1
  FROM workflow_definition_lifecycle AS lifecycle
  WHERE lifecycle.tenant_id = NEW.tenant_id
    AND lifecycle.workflow_definition_id = NEW.workflow_definition_id
    AND lifecycle.workflow_definition_version = NEW.workflow_definition_version
    AND lifecycle.lifecycle_state = 'active'
)
BEGIN
  SELECT RAISE(ABORT, 'only active workflow versions can be newly assigned to a workspace');
END;
""",
              """WHEN NOT EXISTS (
  SELECT 1
  FROM workflow_definition_lifecycle AS lifecycle
  WHERE lifecycle.tenant_id = NEW.tenant_id
    AND lifecycle.workflow_definition_id = NEW.workflow_definition_id
    AND lifecycle.workflow_definition_version = NEW.workflow_definition_version
    AND lifecycle.lifecycle_state = 'active'
)
  AND NOT EXISTS (
    SELECT 1
    FROM workspace_workflow_assignments AS existing
    WHERE existing.tenant_id = NEW.tenant_id
      AND existing.workspace_id = NEW.workspace_id
      AND existing.workflow_definition_id = NEW.workflow_definition_id
      AND existing.workflow_definition_version = NEW.workflow_definition_version
  )
BEGIN
  SELECT RAISE(ABORT, 'only active workflow versions can be newly assigned to a workspace');
END;
""",
          )

          replace_once(
              "tests/unit/export-roundtrip.test.ts",
              """  it("rejects a workspace assignment to an exported retired workflow version", () => {
    const source = createSyntheticExport();
    const assignment = source.workspaceWorkflowAssignments?.[0];
    expect(assignment).toBeDefined();
    const lifecycleExport = {
      ...source,
      workflowDefinitionLifecycles: source.workflowDefinitions.map(
        (definition) => ({
          tenantId: source.tenant.id,
          workflowDefinitionId: definition.id,
          workflowDefinitionVersion: definition.version,
          lifecycleState:
            definition.id === assignment!.workflowDefinitionId &&
            definition.version === assignment!.workflowDefinitionVersion
              ? ("retired" as const)
              : ("active" as const),
          changedAt: source.exportedAt,
        }),
      ),
    };

    expect(() => parseExport(JSON.stringify(lifecycleExport))).toThrow(
      /references a retired workflow version/,
    );
  });
""",
              """  it("rejects a workspace assignment to an exported retired workflow version", () => {
    const source = createSyntheticExport();
    const definition = source.workflowDefinitions[0]!;
    const assignment = {
      tenantId: source.tenant.id,
      workspaceId: source.workspaces[0]!.id,
      workflowDefinitionId: definition.id,
      workflowDefinitionVersion: definition.version,
      isDefault: true,
      createdBySubjectId: source.identitySubjects[0]!.id,
      createdAt: source.exportedAt,
      updatedBySubjectId: source.identitySubjects[0]!.id,
      updatedAt: source.exportedAt,
    };
    const lifecycleExport = {
      ...source,
      workspaceWorkflowAssignments: [assignment],
      workflowDefinitionLifecycles: source.workflowDefinitions.map(
        (candidate) => ({
          tenantId: source.tenant.id,
          workflowDefinitionId: candidate.id,
          workflowDefinitionVersion: candidate.version,
          lifecycleState:
            candidate.id === assignment.workflowDefinitionId &&
            candidate.version === assignment.workflowDefinitionVersion
              ? ("retired" as const)
              : ("active" as const),
          changedAt: source.exportedAt,
        }),
      ),
    };

    expect(() => parseExport(JSON.stringify(lifecycleExport))).toThrow(
      /references a retired workflow version/,
    );
  });
""",
          )

          replace_once(
              "tests/unit/workflow-definition-lifecycle-service.test.ts",
              ").rejects.toThrow(/only an active workflow version/u);",
              ").rejects.toThrow(/only an active workflow version/iu);",
          )
          PY
          pnpm exec prettier --write tests/unit/export-roundtrip.test.ts tests/unit/workflow-definition-lifecycle-service.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/0006_workflow_definition_lifecycle.sql tests/unit/export-roundtrip.test.ts tests/unit/workflow-definition-lifecycle-service.test.ts
          git commit -m "Fix workflow lifecycle integration edge cases"
          git push origin HEAD:feature/workflow-retirement-deprecation
