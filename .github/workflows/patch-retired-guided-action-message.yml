name: Patch Retired Guided Action Message

on:
  push:
    branches:
      - feature/controlled-document-retirement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/controlled-document-retirement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add retirement-specific guided action guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/demo/workflow-demo.ts')
          text = path.read_text()
          old = '''  const demo = createGuidedDemoContext(sessionId);
          const current = await loadGuidedDemoState(database, sessionId);
          if (current.nextAction !== action) {
          '''
          new = '''  const demo = createGuidedDemoContext(sessionId);
          const current = await loadGuidedDemoState(database, sessionId);
          if (current.documentStatus === "retired") {
            throw new Error(
              "Retired documents are historical and cannot be changed or receive new workflow activity.",
            );
          }
          if (current.nextAction !== action) {
          '''
          if old not in text:
              raise SystemExit('guided action guard marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write src/demo/workflow-demo.ts
      - run: pnpm check
      - name: Commit validated retired-action message
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/demo/workflow-demo.ts
          git commit -m "Clarify retired guided action rejection"
          git push origin HEAD:feature/controlled-document-retirement
