name: Queue Action Status Milestone

on:
  push:
    branches:
      - feature/queue-native-review-approval-actions
    paths:
      - .github/workflows/queue-action-status-milestone.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/queue-native-review-approval-actions
      - name: Record PR 37 milestone
        run: sed -i 's/and versioned per-document evidence manifest export PR #36\./versioned per-document evidence manifest export PR #36, and queue-native review and approval actions PR #37./' docs/STATUS.md
      - name: Commit milestone
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add docs/STATUS.md
          git diff --cached --check
          git commit -m "Record queue action release milestone"
          git push origin HEAD:feature/queue-native-review-approval-actions
